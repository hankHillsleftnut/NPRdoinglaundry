<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini-player fill</title>
<style>
:root{--canvas:#F4F2EE;--raised:#F9F7F5;--text:#121212;--label:#696765;--wash:rgba(40,36,30,0.06);--icon:#1E1E1E;
--inner-top:#FFFFFF;--outer:rgba(40,36,30,0.10);--contact:rgba(58,44,28,0.10);--cast:rgba(70,52,30,0.16);--ambient:rgba(70,52,30,0.05);
--amber:#F2B84B;--night7:#3A3834;--night9:#151412}
body{margin:0;min-height:100vh;background:var(--canvas);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;font-family:"Geist","Inter",-apple-system,system-ui,sans-serif}
.pill{position:relative;width:354px;height:64px;box-sizing:border-box;padding:0 8px;display:flex;align-items:center;gap:12px;border-radius:999px;overflow:hidden;background:var(--raised);
box-shadow:inset 0 1px 0 var(--inner-top),0 0 0 .5px var(--outer),0 1px 1.5px var(--contact),0 4px 10px -4px var(--cast),0 10px 30px -10px var(--ambient)}
.fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,color-mix(in oklab,var(--amber) 22%,transparent),color-mix(in oklab,var(--amber) 22%,transparent) calc(100% - 18px),color-mix(in oklab,var(--amber) 34%,transparent));
animation:grow 12s linear infinite}
.paused .fill{animation-play-state:paused;opacity:.7}
@keyframes grow{from{width:0}to{width:100%}}
.art{position:relative;width:44px;height:44px;flex-shrink:0;border-radius:999px;background-color:var(--night7);
background-image:radial-gradient(circle farthest-corner at 85% 15% in oklab,var(--amber) 0%,transparent 55%),radial-gradient(circle farthest-corner at 0% 100% in oklab,var(--night9) 0%,transparent 80%)}
.t{position:relative;flex:1;min-width:0}.t b{display:block;font-weight:500;font-size:15px;color:var(--text);font-family:-apple-system,"SF Pro Text",system-ui}.t span{font-size:13px;color:var(--label)}
button{position:relative;width:44px;height:44px;border:0;border-radius:999px;background:var(--wash);display:flex;align-items:center;justify-content:center;cursor:pointer}
p{max-width:354px;margin:0;font-size:13px;line-height:1.5;color:var(--label)}
@media (prefers-reduced-motion:reduce){.fill{animation:none;width:34%}}
</style></head><body>
<div class="pill" id="p"><div class="fill"></div><div class="art"></div><div class="t"><b>the week you stopped rushing</b><span>chapter 2 · the standup · 8 min left</span></div>
