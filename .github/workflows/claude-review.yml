name: claude review
# An automated code review on every PR (founder, 21 Oct): Claude reads the diff
# against Retrospect's rules and posts inline comments plus one summary.
# Needs the ANTHROPIC_API_KEY repository secret; without it the job skips.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when the key isn't set
        if: env.HAS_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY is not set; skipping the Claude review."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            The PR branch is checked out in the working directory.

            Review this pull request as a senior iOS and backend engineer for Retrospect.
            Read the diff (gh pr diff) and the files it touches. Report only real problems,
            each with the concrete scenario where it goes wrong:
            - Bugs: wrong conditions, missing awaits, null handling, races, broken callers.
            - Swift quality: SwiftUI state ownership, main-actor correctness, retain cycles,
              force unwraps, accessibility (labels, Dynamic Type, 44pt targets).
            - Design system (design-system/principles/motion-system.md, design-system/process.md):
              new-design Swift uses tokens only (RColor, RDimension, RType, RMotion, RHaptic);
              no raw colours, sizes, springs, curves or haptics; nothing animates linearly
              unless it follows real time; every motion respects Reduce Motion.
            - Backend: auth on every route, the user id taken from the token never the body,
              per-user limits on anything that spends money, migrations for schema changes.
            - Security and privacy: no secrets in code, no personal content in logs or analytics,
              payments never grant access without a validated transaction.
            Post each issue inline with mcp__github_inline_comment__create_inline_comment
            (confirmed: true). Then post one top-level comment with gh pr comment that starts
            with "Claude review:" and either "no blocking issues" or the count of blocking issues.
            Only post GitHub comments; don't reply with review text as messages.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
