name: design system
on:
  pull_request:
    paths:
      - 'design-system/**'
      - 'Retrospect/Retrospect/DesignSystemV2/**'
      - 'Retrospect/Retrospect/Features/**'
concurrency:
  # A newer push to the same PR cancels its older run. Pushes to main are keyed by commit, so
  # a later merge never cancels an earlier one's iOS check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tokens-and-literals:
    # Light job: always on GitHub's runner (free while public), never queued behind the iOS build; see quality.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tokens validate; TOKENS.md is up to date
        # TOKENS.md no longer carries a token-count line, so this diff only fails when a token
        # really changed and the table was not regenerated (or someone edited it by hand).
        run: |
          node design-system/tokens/validate.mjs
          git diff --exit-code design-system/tokens/TOKENS.md
      - name: Existing tokens frozen; Paper shadow tokens pinned to Paper
        run: node --test design-system/tokens/tokens.test.mjs
      - name: Generated Swift is up to date
        run: |
          node design-system/tokens/to-swift.mjs
          git diff --exit-code Retrospect/Retrospect/DesignSystemV2/Generated/Tokens.swift
      - name: No raw colours, sizes, springs or haptics in new-design Swift
        run: node design-system/tools/check-swift-literals.mjs
