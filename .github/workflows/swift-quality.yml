name: swift quality
# New-design Swift only (DesignSystemV2, Features); old screens are retired, not linted.
on:
  pull_request:
    paths:
      - 'Retrospect/**/*.swift'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/swift-quality.yml'
jobs:
  lint-and-format:
    # Linux: lint needs no Xcode, and macOS runners are scarce (they queued every PR).
    runs-on: ubuntu-latest
    env:
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d
      SWIFTFORMAT_VERSION: 0.64.0
      SWIFTFORMAT_SHA256: 599eb5d2d8cf43e1128e79cd72f3bc2fec1b3189c3ac7593fbe732f2568fed36
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned, checksum-verified tools
        run: |
          curl -sSfL -o sl.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  sl.zip" | sha256sum -c -
          curl -sSfL -o sf.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
          echo "${SWIFTFORMAT_SHA256}  sf.zip" | sha256sum -c -
          mkdir -p tools && unzip -q -o sl.zip -d tools && unzip -q -o sf.zip -d tools && mv tools/swiftformat_linux tools/swiftformat && chmod +x tools/swiftlint tools/swiftformat
      - name: SwiftLint (strict)
        run: tools/swiftlint lint --strict --reporter github-actions-logging
      - name: SwiftFormat (lint only)
        run: |
          paths=()
          for p in Retrospect/Retrospect/DesignSystemV2 Retrospect/Retrospect/Features; do [ -d "$p" ] && paths+=("$p"); done
          if [ ${#paths[@]} -eq 0 ]; then echo "no new-design Swift yet"; exit 0; fi
          tools/swiftformat --lint "${paths[@]}" --exclude Retrospect/Retrospect/DesignSystemV2/Generated
