name: swift quality
# New-design Swift only (DesignSystemV2, Features); old screens are retired, not linted.
on:
  pull_request:
    paths:
      - 'Retrospect/**/*.swift'
      - '.swiftlint.yml'
      - '.swiftformat'
      - '.github/workflows/swift-quality.yml'
concurrency:
  # A newer push to the same PR cancels its older run. Pushes to main are keyed by commit, so
  # a later merge never cancels an earlier one's iOS check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    # `CI_HOSTED=true` (repo variable) runs on GitHub's runners; see quality.yml.
    runs-on: ${{ vars.CI_HOSTED == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","light"]') }}
    env:
      SWIFTLINT_VERSION: 0.65.1
      SWIFTFORMAT_VERSION: 0.64.0
    steps:
      - uses: actions/checkout@v4
      - name: Pinned tool versions (a hosted runner downloads them; a self-hosted one must have them)
        run: |
          mkdir -p tools
          if command -v swiftlint >/dev/null && command -v swiftformat >/dev/null; then
            ln -sf "$(command -v swiftlint)" tools/swiftlint && ln -sf "$(command -v swiftformat)" tools/swiftformat
          else
            curl -sSL -o /tmp/swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux.zip"
            unzip -oq /tmp/swiftlint.zip -d /tmp/swiftlint && install /tmp/swiftlint/swiftlint tools/swiftlint
            curl -sSL -o /tmp/swiftformat.zip "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat_linux.zip"
            unzip -oq /tmp/swiftformat.zip -d /tmp/swiftformat && install /tmp/swiftformat/swiftformat_linux tools/swiftformat
          fi
          test "$(tools/swiftlint version)" = "${SWIFTLINT_VERSION}" || { echo "need SwiftLint ${SWIFTLINT_VERSION}"; exit 1; }
          test "$(tools/swiftformat --version)" = "${SWIFTFORMAT_VERSION}" || { echo "need SwiftFormat ${SWIFTFORMAT_VERSION}"; exit 1; }
      - name: SwiftLint (strict)
        run: tools/swiftlint lint --strict --reporter github-actions-logging
      - name: SwiftFormat (lint only)
        run: |
          paths=()
          for p in Retrospect/Retrospect/DesignSystemV2 Retrospect/Retrospect/Features; do [ -d "$p" ] && paths+=("$p"); done
          if [ ${#paths[@]} -eq 0 ]; then echo "no new-design Swift yet"; exit 0; fi
          tools/swiftformat --lint "${paths[@]}" --exclude Retrospect/Retrospect/DesignSystemV2/Generated
