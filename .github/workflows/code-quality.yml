name: code quality
on:
  pull_request:
jobs:
  swift-lint-and-format:
    # New-design Swift only (DesignSystemV2, Features); old screens are retired, not linted.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint swiftformat
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: SwiftFormat (lint only)
        run: |
          paths=""
          for p in Retrospect/Retrospect/DesignSystemV2 Retrospect/Retrospect/Features; do [ -d "$p" ] && paths="$paths $p"; done
          swiftformat --lint $paths --exclude Retrospect/Retrospect/DesignSystemV2/Generated
  secrets:
    # No keys, tokens or service-role secrets in any commit of this PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks on this PR's commits
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
