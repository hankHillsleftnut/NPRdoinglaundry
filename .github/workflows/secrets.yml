name: secrets
# No keys, tokens or service-role secrets in any commit of a PR.
on:
  pull_request:
jobs:
  gitleaks:
    runs-on: [self-hosted, macOS, retrospect]
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pinned gitleaks on the runner
        run: gitleaks version | grep -qx "${GITLEAKS_VERSION}" || { echo "need gitleaks ${GITLEAKS_VERSION}"; exit 1; }
      - name: Scan this PR's commits
        run: gitleaks git --no-banner --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
