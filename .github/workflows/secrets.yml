name: secrets
# No keys, tokens or service-role secrets in any commit of a PR.
on:
  pull_request:
concurrency:
  # A newer push to the same PR cancels its older run. Pushes to main are keyed by commit, so
  # a later merge never cancels an earlier one's iOS check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # Light job: always on GitHub's runner (free while public), never queued behind the iOS build; see quality.yml.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pinned gitleaks (hosted runner installs it; a self-hosted one must already have it)
        run: |
          if ! command -v gitleaks >/dev/null; then
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
            sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          fi
          gitleaks version | grep -qx "${GITLEAKS_VERSION}" || { echo "need gitleaks ${GITLEAKS_VERSION}"; exit 1; }
      - name: Scan this PR's commits
        run: gitleaks git --no-banner --redact --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .
