name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A newer push to the same PR cancels its older run. Pushes to main are keyed by commit, so
  # a later merge never cancels an earlier one's iOS check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: [self-hosted, light]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Typechecks src and tests together. The build config excludes tests, so
      # without this step a type error in a test would never be caught.
      - run: npm run typecheck
      - run: npm test

  changes:
    # Decides on Linux whether the iOS build is needed, so no macOS runner is requested
    # for docs, backend or CI-only PRs (GitHub's macOS capacity is constrained). Contract
    # fixtures count as app changes: the app's tests decode every one of them.
    runs-on: [self-hosted, light]
    outputs:
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          # A PR compares with its base; a push to main compares with the previous main.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # No usable base (a first push, or a commit this clone lacks): build the app.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null || git diff --name-only "$base" HEAD | grep -qE '^(Retrospect/|docs/team/contracts/fixtures/|\.github/workflows/quality\.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: [self-hosted, macOS, retrospect]  # the first runner only: one iOS build at a time
    steps:
      - uses: actions/checkout@v4
      # Builds the app and runs the Platform test plan (contract fixtures, Platform units) on
      # CI's own simulator: the engineers keep agent-a and agent-b. CI doesn't create simulators.
      - run: >-
          xcodebuild test -project Retrospect/Retrospect.xcodeproj -scheme Retrospect
          -testPlan Platform -destination 'platform=iOS Simulator,id=2E876B5C-E345-44BC-A7D5-236837088B31'
          -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" -disableAutomaticPackageResolution
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
