name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A newer push to the same PR cancels its older run. Pushes to main are keyed by commit, so
  # a later merge never cancels an earlier one's iOS check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Where CI runs is a repo variable, not a code change: `CI_HOSTED=true` (Settings → Variables)
# sends every job to GitHub's own runners (free while the repo is public); unset, or anything
# else, keeps them on the self-hosted Macs. Flip it back when the repo goes private again.

jobs:
  api:
    runs-on: ${{ vars.CI_HOSTED == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","light"]') }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Typechecks src and tests together. The build config excludes tests, so
      # without this step a type error in a test would never be caught.
      - run: npm run typecheck
      - run: npm test

  new-backend-only:
    # Founder rule: the new app talks to the new backend only (Backend.Client -> /v2 -> Session). Fails
    # when Platform/ (except Bridges.swift), Features/ or DesignSystemV2/ use the old client, a raw
    # request, or a path outside Backend.PathTemplate.
    runs-on: ${{ vars.CI_HOSTED == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","light"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/
      - run: node scripts/check-new-backend-only.mjs

  changes:
    # Decides on Linux whether the iOS build is needed, so no macOS runner is requested
    # for docs, backend or CI-only PRs (GitHub's macOS capacity is constrained). Contract
    # fixtures count as app changes: the app's tests decode every one of them.
    runs-on: ${{ vars.CI_HOSTED == 'true' && 'ubuntu-latest' || fromJSON('["self-hosted","light"]') }}
    outputs:
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          # A PR compares with its base; a push to main compares with the previous main.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # No usable base (a first push, or a commit this clone lacks): build the app.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null || git diff --name-only "$base" HEAD | grep -qE '^(Retrospect/|docs/team/contracts/fixtures/|\.github/workflows/quality\.yml)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    # Self-hosted: any Mac runner labelled `retrospect`, with its own simulator named `ci`, its
    # own persistent derived data, one iOS build at a time. Hosted: GitHub's macOS 26 image,
    # which has Xcode 26 installed; it builds clean every run and makes its own `ci` simulator.
    runs-on: ${{ vars.CI_HOSTED == 'true' && 'macos-26' || fromJSON('["self-hosted","macOS","retrospect"]') }}
    env:
      # Persistent on a self-hosted Mac ($RUNNER_TEMP is wiped per job); per-job on a hosted one.
      DERIVED_DATA: ${{ vars.CI_HOSTED == 'true' && '$RUNNER_TEMP/dd' || '$HOME/actions-runner/dd-ci' }}
      XCODE_VERSION: '26.3'
    steps:
      - uses: actions/checkout@v4
      - name: Xcode ${{ env.XCODE_VERSION }} and a `ci` simulator (hosted runner only)
        if: vars.CI_HOSTED == 'true'
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          else
            echo "Xcode ${XCODE_VERSION} is not on this image; installed:"; ls /Applications | grep -i xcode; exit 1
          fi
          xcodebuild -version
          xcrun simctl create ci "iPhone 17 Pro"
      # Packages come from Package.resolved (pinned). On a fresh machine this fills the derived
      # data's SourcePackages once; after that it's a no-op, and the test step never resolves.
      - run: >-
          xcodebuild -resolvePackageDependencies -project Retrospect/Retrospect.xcodeproj
          -scheme Retrospect -derivedDataPath "${{ env.DERIVED_DATA }}"
      # Builds the app and runs the Platform test plan (contract fixtures, Platform units) on
      # the runner's own simulator, `ci` (the engineers keep agent-a and agent-b; CI on a
      # self-hosted Mac never creates simulators). The `ci` simulator is found by name and
      # addressed by id: a bare `name=` would also pin the newest installed iOS, and the device
      # may run an older one.
      - run: |
          udid=$(xcrun simctl list devices available -j | jq -r '.devices[][] | select(.name=="ci") | .udid' | head -1)
          test -n "$udid" || { echo "no simulator named ci on this runner (xcrun simctl create ci \"iPhone 17 Pro\")"; exit 1; }
          xcodebuild test -project Retrospect/Retrospect.xcodeproj -scheme Retrospect \
            -testPlan Platform -destination "platform=iOS Simulator,id=$udid" \
            -configuration Debug -derivedDataPath "${{ env.DERIVED_DATA }}" -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
