name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Typechecks src and tests together. The build config excludes tests, so
      # without this step a type error in a test would never be caught.
      - run: npm run typecheck
      - run: npm test

  ios:
    runs-on: macos-latest
    # macOS runners are scarce (GitHub capacity): build only when app code or the project changed.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did app code change?
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE '^Retrospect/'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"; echo "No app changes: skipping the iOS build."
          fi
      - if: steps.changed.outputs.app == 'true'
        run: xcodebuild -project Retrospect/Retrospect.xcodeproj -scheme Retrospect -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
