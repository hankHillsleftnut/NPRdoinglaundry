name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: [self-hosted, light]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Typechecks src and tests together. The build config excludes tests, so
      # without this step a type error in a test would never be caught.
      - run: npm run typecheck
      - run: npm test

  changes:
    # Decides on Linux whether the iOS build is needed, so no macOS runner is requested
    # for docs, backend or CI-only PRs (GitHub's macOS capacity is constrained).
    runs-on: [self-hosted, light]
    outputs:
      app: ${{ steps.changed.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -qE '^Retrospect/'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: [self-hosted, macOS, retrospect]  # the first runner only: one iOS build at a time
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project Retrospect/Retrospect.xcodeproj -scheme Retrospect -sdk iphonesimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
