<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Invites</title>
<style>
  :root { --bg: #f7f5f0; --ink: #1c1b19; --muted: #6b6760; --line: #e2ded5; --bad: #a33; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --ink: #eeeae2; --muted: #9a958b; --line: #2c2a26; --bad: #e88; } }
  body { font: 14px/1.45 -apple-system, system-ui, sans-serif; margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); }
  h1 { font-size: 20px; margin: 0 0 16px; } h2 { font-size: 16px; margin: 28px 0 8px; }
  table { border-collapse: collapse; width: 100%; } td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; } .muted { color: var(--muted); } .scroll { overflow-x: auto; }
  button { font: inherit; padding: 4px 10px; } .shown { font-family: ui-monospace, monospace; padding: 8px; border: 1px solid var(--line); margin: 8px 0; word-break: break-all; }
  .error { color: var(--bad); }
</style>
</head>
<body>
<h1>invites</h1>
<form id="auth"><input id="secret" type="password" placeholder="admin secret" autocomplete="off" aria-label="admin secret"> <button>open</button> <span id="authError" class="error"></span></form>
<div id="app" hidden>
  <div id="shown" class="shown" hidden></div>
  <h2>waiting</h2>
  <div class="scroll"><table><thead><tr><th>when</th><th>from</th><th>name</th><th>email</th><th>reason</th><th></th></tr></thead><tbody id="waiting"></tbody></table></div>
  <h2>new codes</h2>
  <form id="make"><input id="count" type="number" min="1" max="50" value="1" aria-label="how many"> <select id="kind" aria-label="kind"><option>founder</option><option>review</option></select> <button>make</button></form>
  <h2>every invite</h2>
  <div class="scroll"><table><thead><tr><th>made</th><th>kind</th><th>from</th><th>used by</th><th>state</th><th></th></tr></thead><tbody id="all"></tbody></table></div>
</div>
<script>
  // Every value goes on the page as text, never as HTML.
  let SECRET = sessionStorage.getItem('adminSecret') || '';
  const $ = (id) => document.getElementById(id);
  const el = (tag, text) => { const e = document.createElement(tag); if (text !== undefined && text !== null) e.textContent = String(text); return e; };
  async function api(method, path, body) {
    const res = await fetch('/admin' + path, { method, headers: { 'x-admin-secret': SECRET, 'Content-Type': 'application/json' }, ...(body ? { body: JSON.stringify(body) } : {}) });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || String(res.status));
    return json.data;
  }
  function show(lines) { const s = $('shown'); s.replaceChildren(...lines.map((l) => el('div', l))); s.hidden = false; }
  async function load() {
    const waiting = await api('GET', '/waitlist?status=waiting');
    $('waiting').replaceChildren(...waiting.map((w) => {
      const tr = el('tr');
      [new Date(w.createdAt).toLocaleString(), w.source, w.name || '', w.email || '', w.reason || ''].forEach((v) => tr.append(el('td', v)));
      const td = el('td'); const ok = el('button', 'approve'); const no = el('button', 'decline');
      ok.onclick = async () => { const d = await api('POST', '/waitlist/' + w.id + '/approve'); show(['send this link yourself; it is shown once:', d.link, 'code ' + d.code]); load(); };
      no.onclick = async () => { await api('POST', '/waitlist/' + w.id + '/decline'); load(); };
      td.append(ok, ' ', no); tr.append(td); return tr;
    }));
    const all = await api('GET', '/invites');
    $('all').replaceChildren(...all.map((i) => {
      const tr = el('tr');
      const state = i.revokedAt ? 'revoked' : i.usedAt ? 'used' : 'unused';
      [new Date(i.createdAt).toLocaleDateString(), i.kind, i.ownerName || (i.ownerUserId ? 'a member' : ''), i.usedByName || (i.usedAt ? 'someone' : ''), state].forEach((v) => tr.append(el('td', v)));
      const td = el('td');
      if (state === 'unused') { const r = el('button', 'revoke'); r.onclick = async () => { await api('POST', '/invites/' + i.id + '/revoke'); load(); }; td.append(r); }
      tr.append(td); return tr;
    }));
  }
  $('make').onsubmit = async (e) => { e.preventDefault(); const d = await api('POST', '/invites', { count: Number($('count').value), kind: $('kind').value }); show(['shown once:', ...d.invites.map((i) => i.link + '  ' + i.code)]); load(); };
  async function open() {
    try { await load(); sessionStorage.setItem('adminSecret', SECRET); $('auth').hidden = true; $('app').hidden = false; }
    catch { $('authError').textContent = 'that secret did not work'; SECRET = ''; }
  }
  $('auth').onsubmit = (e) => { e.preventDefault(); SECRET = $('secret').value.trim(); open(); };
  if (SECRET) open();
</script>
</body>
</html>
