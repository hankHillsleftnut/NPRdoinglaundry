# Render.com Blueprint for Retrospect API
# Deploy by connecting this repo to Render and using this file

services:
  - type: web
    name: retrospect-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

# Cron jobs for pattern detection
  - type: cron
    name: daily-pattern-detection
    env: node
    schedule: "0 3 * * *"
    buildCommand: npm install && npm run build
    startCommand: npm run cron:daily
    envVars:
      - fromService:
          type: web
          name: retrospect-api
          envVarKey: SUPABASE_URL
      - fromService:
          type: web
          name: retrospect-api
          envVarKey: SUPABASE_SERVICE_KEY
      - fromService:
          type: web
          name: retrospect-api
          envVarKey: OPENAI_API_KEY

  - type: cron
    name: weekly-pattern-detection
    env: node
    schedule: "0 4 * * 0"
    buildCommand: npm install && npm run build
    startCommand: npm run cron:weekly
    envVars:
      - fromService:
          type: web
          name: retrospect-api
          envVarKey: SUPABASE_URL
      - fromService:
          type: web
          name: retrospect-api
          envVarKey: SUPABASE_SERVICE_KEY
      - fromService:
          type: web
          name: retrospect-api
          envVarKey: OPENAI_API_KEY
